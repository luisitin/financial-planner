<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Planner</title>
<!--
  The SHELL. It never contains page content. Pages live in modules/<group>/<id>/
  and are discovered through modules/registry.js (generated -- run `npm run registry`).
  Read AGENTS.md before editing anything.
-->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-180.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181c22" media="(prefers-color-scheme: dark)">
<script id="look">
// How this phone looks (Settings > Screen; core/look.js keeps the choice): text size and light or dark are put on <html>
// here, before the first paint, so a page never flashes in the other size or colours. The same key and the same reading
// as core/look.js (planner.look, planner.look.sandbox in the sandbox; ?look=... for one visit); tests/look.test.mjs runs
// this script. Nothing stored: nothing happens, and the app looks as it always did.
(function (w) {
  try {
    var q = String(w.location.search || ""), saved = {}, ask = [];
    try { saved = JSON.parse(w.localStorage.getItem(/[?&]sandbox(=|&|$)/.test(q) ? "planner.look.sandbox" : "planner.look") || "null") || {}; } catch (e) { saved = {}; }
    if (saved.fmt !== 1) saved = {};
    var m = /[?&]look=([^&#]*)/.exec(q);
    if (m) ask = decodeURIComponent(m[1]).split(",");
    var has = function (x) { return ask.indexOf(x) >= 0; };
    var text = has("largest") ? "largest" : has("larger") ? "larger" : saved.text;
    var theme = has("dark") ? "dark" : has("light") ? "light" : saved.theme;
    var root = w.document.documentElement;
    if (text === "larger" || text === "largest") root.setAttribute("data-text", text);
    if (theme === "light" || theme === "dark") {
      root.setAttribute("data-theme", theme);
      var scheme = w.document.querySelector('meta[name="color-scheme"]');
      if (scheme) scheme.setAttribute("content", theme);
    }
  } catch (e) { }
})(window);
</script>
<link rel="stylesheet" href="./core/ui/base.css">
<script id="opening-guard">
// The opening guard (docs/PLAN.md "On a static host (GitHub Pages)"). A plain script, so it runs even when the app's
// own files cannot start. tools/build.mjs leaves it out of the single-file copy; tests/heal.test.mjs runs it.
// 1. Asks for sw.js, which checks every file against the site on each open, so a phone never runs old and new files
//    together. Only where a service worker can work: a secure page (https, or localhost) over http(s). Elsewhere (a LAN
//    address over http, a file, a sandboxed frame) nothing happens and nothing is said.
// 2. When core/app.js cannot start (its files do not fit together, one did not load, or one threw while starting), the
//    screen would stay on "Opening your plan..." for ever. It reloads once (never twice in two minutes, never in the
//    sandbox: core/heal.js, same key), then says so in plain words with a Reload button.
// 3. Still on that screen with no file arriving for 15 seconds (a stalled connection): the same one reload. A slow open
//    that keeps bringing files is left alone. After 8 seconds it says it is still trying.
(function (w) {
  var KEY = "planner.healAt", WINDOW_MS = 120000;
  // the folder the app lives in ("https://someone.github.io/financial-planner/"): its own files are under it
  var HOME = String(w.location.href || "").replace(/[?#].*$/, "").replace(/[^/]*$/, "");
  function canUseWorker() {
    try { return !!w.isSecureContext && "serviceWorker" in w.navigator && /^https?:$/.test(w.location.protocol); } catch (e) { return false; }
  }
  if (canUseWorker()) {
    try { w.navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () { }); } catch (e) { }
  }
  function healOnce() {
    try {
      if (/[?&]sandbox(=|&|$)/.test(w.location.search || "")) return false;   // testers see the error at once (core/app.js)
      var s = w.sessionStorage, now = Date.now(), last = Number(s.getItem(KEY)), since = now - last;
      if (last > 0 && since >= 0 && since < WINDOW_MS) return false;
      s.setItem(KEY, String(now));
      if (s.getItem(KEY) !== String(now)) return false;
      w.location.reload();
      return true;
    } catch (e) { return false; }
  }
  function el(tag, cls, text) { var x = w.document.createElement(tag); if (cls) x.className = cls; if (text) x.textContent = text; return x; }
  // 3. A connection that stalls after the page was answered (a file never comes) would leave "Opening your plan..." up
  //    for ever. The guard counts the files that have arrived (Resource Timing; the browser's default stops counting at
  //    250, the app has about 570, hence the larger buffer). After 15 seconds in which none arrived it reloads once
  //    (same rule as above); the reload asks the site for one file first and, when the site does not answer, opens from
  //    the worker's saved whole copy (sw.js "The saved whole copy"). A slow open that keeps bringing files is left
  //    alone, however long it takes. Where files cannot be counted: 30 seconds from the start. When it may not reload
  //    (it just did, or the sandbox) it says so and offers a Reload button.
  // 4. After 8 seconds on that screen it adds one plain line, so a slow open does not look like a dead one.
  var TICK_MS = 5000, QUIET_MS = 15000, BLIND_MS = 30000, SLOW_MS = 8000;
  function arrived() { try { return w.performance.getEntriesByType("resource").length; } catch (e) { return -1; } }
  function slowLine(text) {
    var o = w.document.querySelector("#content .booting");
    if (!o) return null;
    var line = o.querySelector(".booting-slow");
    if (!line) { line = el("div", "muted booting-slow"); o.appendChild(line); }
    line.textContent = text;
    return o;
  }
  if (typeof w.setTimeout === "function") {
    try { w.performance.setResourceTimingBufferSize(4000); } catch (e) { }
    w.setTimeout(function () { slowLine("This is taking longer than usual. Still trying\u2026"); }, SLOW_MS);
    var seen = arrived(), quiet = 0;
    (function watch() {
      w.setTimeout(function () {
        if (!w.document.querySelector("#content .booting")) return;         // it drew, or the red notice took its place
        var n = arrived();
        if (n >= 0 && n !== seen) { seen = n; quiet = 0; } else quiet += TICK_MS;
        if (quiet < (n < 0 ? BLIND_MS : QUIET_MS)) return watch();
        if (healOnce()) return;
        var o = slowLine("The connection is not answering. Check your signal, then tap Reload.");
        if (!o) return;
        var row = el("div", "row"), button = el("button", "secondary", "Reload");
        row.style.justifyContent = "center"; row.style.marginTop = "10px"; button.type = "button";
        button.addEventListener("click", function () { w.location.reload(); });
        row.appendChild(button); o.appendChild(row);
      }, TICK_MS);
    })();
  }
  w.addEventListener("error", function (e) {
    var t = e.target, opening = w.document.querySelector("#content .booting");
    var appFile = t && t.tagName === "SCRIPT" && t.type === "module";     // core/app.js (or a file it needs) did not load
    var linkError = !!e.error && e.error.name === "SyntaxError";          // "does not provide an export named ...", "Importing binding name ... is not found"
    // one of the app's own files threw while it was starting (an old core/format.js under a new core/app.js: `import *`
    // is not checked when the files link, so it is a TypeError, not a SyntaxError). Not the page itself (an inline script).
    var where = typeof e.filename === "string" ? e.filename.replace(/[?#].*$/, "") : "";
    var appThrew = !!HOME && where.indexOf(HOME) === 0 && /\.m?js$/.test(where);
    if (!opening || !(appFile || linkError || appThrew) || healOnce()) return;
    var pc = !!w.document.querySelector('script[type="importmap"]');      // the computer's server always adds one
    var box = el("div", "notice error"), row = el("div", "row"), button = el("button", "", "Reload");
    var more = el("details", "notice-details"), list = el("ul");
    box.setAttribute("role", "alert");
    box.appendChild(el("div", "", pc ? "The app could not open. Reload the page; if it keeps happening, restart the app on your computer." : "The app could not open. Reload to try again."));
    row.style.marginTop = "10px"; button.type = "button";
    button.addEventListener("click", function () { w.location.reload(); });
    row.appendChild(button); box.appendChild(row);
    more.appendChild(el("summary", "", "Show details"));
    list.appendChild(el("li", "", appFile ? "A file of the app did not load: " + (t.src || "core/app.js") : String(e.message || e.error)));
    more.appendChild(list); box.appendChild(more);
    opening.parentNode.replaceChild(box, opening);
    var pill = w.document.getElementById("status");                       // it would say "Connecting..." for ever
    if (pill) pill.style.display = "none";
  }, true);
})(window);
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="nav-skip" type="button">Skip to the page</button>
    <button id="nav-toggle" type="button" aria-label="Menu" title="Menu" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
    <button id="nav-back" type="button" aria-label="Back" title="Back" hidden><span aria-hidden="true">&#8249;</span></button>
    <span id="page-title">Planner</span>
    <button id="status" type="button" title="connection status">Connecting…</button>
  </header>
  <div id="scrim"></div>
  <nav id="sidebar" aria-label="Pages"></nav>
  <main id="content"><div class="booting"><div class="booting-icon">📒</div><div class="booting-name">Financial Planner</div><div class="muted">Opening your plan…</div></div></main>
</div>
<script type="module" src="./core/app.js"></script>
</body>
</html>
